name: AWS Controlled Remediation

on:
  workflow_dispatch:
    inputs:
      current_value:
        description: Approved current CostCenter value
        required: true
        default: Engineering
        type: string

      confirmation_token:
        description: Exact approval token
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-approval:
    name: Validate Remediation Approval
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build live remediation finding
        shell: bash
        env:
          CURRENT_VALUE: ${{ inputs.current_value }}
        run: |
          set -euo pipefail

          mkdir -p reports/remediation/runtime

          jq -n \
            --arg observed "$CURRENT_VALUE" \
            --arg desired "CC-PLATFORM" \
            '{
              schema_version: "1.0",
              finding_id: "finding-aws-live-tag-001",
              cloud: "aws",
              environment: "dev",
              control_id: "TAG-001",
              resource_type: "aws_instance",
              resource_identifier: "arn:aws:ec2:us-east-1:931058976119:instance/i-033b19d090406151a",
              compliant: false,
              tag_key: "CostCenter",
              observed_value: $observed,
              desired_value: $desired
            }' \
            > reports/remediation/runtime/live-finding.json

      - name: Generate remediation recommendation
        shell: bash
        run: |
          set -euo pipefail

          scripts/remediation/generate-remediation-recommendation.sh \
            reports/remediation/runtime/live-finding.json \
            reports/remediation/runtime/recommendation.json

      - name: Build pre-approval evidence
        shell: bash
        run: |
          set -euo pipefail

          scripts/remediation/build-remediation-evidence.sh \
            reports/remediation/runtime/recommendation.json \
            reports/remediation/runtime/preapproval-evidence.json

      - name: Validate pre-approval evidence
        shell: bash
        run: |
          set -euo pipefail

          scripts/remediation/validate-remediation-evidence.sh \
            reports/remediation/runtime/preapproval-evidence.json

      - name: Validate human approval
        shell: bash
        env:
          CURRENT_VALUE: ${{ inputs.current_value }}
          CONFIRMATION_TOKEN: ${{ inputs.confirmation_token }}
        run: |
          set -euo pipefail

          scripts/remediation/validate-remediation-approval.sh \
            reports/remediation/runtime/recommendation.json \
            reports/remediation/runtime/preapproval-evidence.json \
            'rem-finding-aws-live-tag-001' \
            'aws' \
            'arn:aws:ec2:us-east-1:931058976119:instance/i-033b19d090406151a' \
            'set-tag' \
            'CostCenter' \
            "$CURRENT_VALUE" \
            'CC-PLATFORM' \
            "$CONFIRMATION_TOKEN" \
            reports/remediation/runtime/approval-evidence.json

      - name: Verify approval boundary
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .approval.approved == true
            and .approval.confirmation_token_verified == true
            and .execution.attempted == false
            and .execution.oidc_used == false
            and .execution.dedicated_remediation_identity == false
            and .result.remediation_result == "APPROVED_PENDING_EXECUTION"
          ' reports/remediation/runtime/approval-evidence.json >/dev/null

          echo "AWS REMEDIATION APPROVAL GATE: PASS"
          echo "OIDC BEFORE APPROVAL: NOT USED"
          echo "EXECUTION BEFORE APPROVAL: NOT ATTEMPTED"

      - name: Upload approved remediation evidence
        uses: actions/upload-artifact@v4
        with:
          name: aws-approved-remediation
          path: |
            reports/remediation/runtime/live-finding.json
            reports/remediation/runtime/recommendation.json
            reports/remediation/runtime/preapproval-evidence.json
            reports/remediation/runtime/approval-evidence.json
          if-no-files-found: error
          retention-days: 7

  execute-remediation:
    name: Execute Approved AWS Remediation
    needs: validate-approval
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download approved remediation evidence
        uses: actions/download-artifact@v4
        with:
          name: aws-approved-remediation
          path: reports/remediation/runtime

      - name: Validate execution input
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .remediation.remediation_id == "rem-finding-aws-live-tag-001"
            and .remediation.cloud == "aws"
            and .remediation.environment == "dev"
            and .remediation.resource_identifier ==
              "arn:aws:ec2:us-east-1:931058976119:instance/i-033b19d090406151a"
            and .remediation.action_type == "set-tag"
            and .remediation.tag_key == "CostCenter"
            and .approval.approved == true
            and .approval.confirmation_token_verified == true
            and .execution.attempted == false
            and .result.remediation_result == "APPROVED_PENDING_EXECUTION"
          ' reports/remediation/runtime/approval-evidence.json >/dev/null

          echo "PASS - approved evidence transferred across execution boundary"

      - name: Assume dedicated AWS remediation role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::931058976119:role/mc-finops-github-aws-remediation
          aws-region: us-east-1

      - name: Prove remediation identity
        shell: bash
        run: |
          set -euo pipefail

          CALLER_ARN="$(
            aws sts get-caller-identity \
              --query Arn \
              --output text
          )"

          echo "AWS caller ARN: $CALLER_ARN"

          [[ "$CALLER_ARN" == arn:aws:sts::931058976119:assumed-role/mc-finops-github-aws-remediation/* ]]

          echo "AWS REMEDIATION OIDC RESULT: PASS"

      - name: Execute approved CostCenter remediation
        shell: bash
        run: |
          set -euo pipefail

          scripts/remediation/execute-aws-tag-remediation.sh \
            reports/remediation/runtime/approval-evidence.json \
            reports/remediation/runtime/execution-evidence.json

      - name: Verify final audit evidence
        shell: bash
        run: |
          set -euo pipefail

          jq -e '
            .approval.approved == true
            and .execution.attempted == true
            and .execution.authentication_type == "github-oidc"
            and .execution.oidc_used == true
            and .execution.dedicated_remediation_identity == true
            and .execution.cloud_mutation_performed == true
            and .execution.terraform_mutation_performed == false
            and .after.compliant == true
            and .after.observed_value == "CC-PLATFORM"
            and .result.remediation_result == "EXECUTED"
            and .result.verification_result == "PASS"
          ' reports/remediation/runtime/execution-evidence.json >/dev/null

          echo "AWS CONTROLLED REMEDIATION RESULT: PASS"
          echo "AWS REMEDIATION VERIFICATION RESULT: PASS"

      - name: Upload execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: aws-remediation-execution-evidence
          path: reports/remediation/runtime/execution-evidence.json
          if-no-files-found: error
          retention-days: 7
