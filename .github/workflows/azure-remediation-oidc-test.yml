name: Azure Remediation OIDC Validation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-azure-remediation-oidc:
    name: Validate Azure Remediation OIDC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure remediation identity with OIDC
        uses: azure/login@v3
        with:
          client-id: 49c2dd42-7a23-4765-84a3-7eb604e07c96
          tenant-id: 78591d21-16e0-46d0-8cbb-95fcc94db601
          allow-no-subscriptions: true

      - name: Verify tenant-level Azure identity
        run: |
          az account show \
            --query '{
              TenantId:tenantId,
              User:user.name,
              UserType:user.type
            }' \
            -o table

      - name: Verify expected remediation service principal
        run: |
          CURRENT_CLIENT_ID="$(az account show --query user.name -o tsv)"
          CURRENT_USER_TYPE="$(az account show --query user.type -o tsv)"

          echo "Authenticated client ID: $CURRENT_CLIENT_ID"
          echo "Authenticated user type: $CURRENT_USER_TYPE"

          if [ "$CURRENT_CLIENT_ID" != "49c2dd42-7a23-4765-84a3-7eb604e07c96" ]; then
            echo "ERROR - unexpected Azure remediation identity"
            exit 1
          fi

          if [ "$CURRENT_USER_TYPE" != "servicePrincipal" ]; then
            echo "ERROR - expected servicePrincipal identity"
            exit 1
          fi

          echo "PASS - authenticated through expected Azure remediation identity"
