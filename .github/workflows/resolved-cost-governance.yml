name: Resolved Cost Governance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: resolved-cost-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aws-resolved-cost:
    name: AWS Resolved Cost
    runs-on: ubuntu-latest

    env:
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
      AWS_COST_THRESHOLD_USD: "25"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Install Infracost
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh \
            | sh

          INFRACOST_VERSION="$(infracost --version)"

          echo "Installed Infracost: $INFRACOST_VERSION"

          if ! printf '%s\n' "$INFRACOST_VERSION" \
            | grep -qF 'infracost version 2.16.2'
          then
            echo "ERROR - unexpected Infracost version"
            exit 1
          fi

          infracost scan --help >/dev/null
          infracost inspect --help >/dev/null

          echo "PASS - Infracost resolved-cost runtime available"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/mc-finops-github-aws-deploy
          role-session-name: mc-finops-resolved-cost
          aws-region: us-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          ARN="$(
            aws sts get-caller-identity \
              --query Arn \
              --output text
          )"

          echo "AWS account: $ACCOUNT_ID"
          echo "AWS identity: $ARN"

          if [ "$ACCOUNT_ID" != "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "ERROR - unexpected AWS account"
            exit 1
          fi

          echo "PASS - expected AWS OIDC identity active"

      - name: Verify FinOps policy engine
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/cost/check-cost-policy.sh
          test -x scripts/cost/check-cost-policy.sh

          echo "PASS - FinOps policy engine valid"

      - name: Initialize AWS Terraform backend
        shell: bash
        run: |
          set -euo pipefail

          terraform \
            -chdir=terraform/aws/environments/dev \
            init \
            -input=false

          echo "PASS - AWS Terraform backend initialized"

      - name: Evaluate AWS resolved cost
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports/cost

          export MC_FINOPS_EVIDENCE_FILE="reports/cost/aws-resolved-cost.json"

          scripts/cost/check-cost-policy.sh \
            terraform/aws/environments/dev

          echo "PASS - AWS resolved cost satisfies governed threshold"

      - name: Validate AWS governance evidence
        shell: bash
        run: |
          set -euo pipefail

          EVIDENCE="reports/cost/aws-resolved-cost.json"

          test -s "$EVIDENCE"
          jq empty "$EVIDENCE"

          jq -e '
            .schema_version == "1.0"
            and .control.control_id == "FINOPS-COST-001"
            and .control.cloud == "AWS"
            and .control.evaluation_mode == "plan-json"
            and .cost.currency == "USD"
            and .cost.threshold_monthly_cost == 25
            and .policy.policy_result == "ALLOW"
            and .policy.policy_exit_code == 0
            and .execution.terraform_plan_used == true
            and .execution.terraform_apply_used == false
            and .execution.oidc_used == true
            and .execution.authentication_type == "github-oidc"
            and .decision.governance_result == "ALLOW"
          ' "$EVIDENCE" >/dev/null

          echo "PASS - AWS governance evidence validated"

      - name: Upload AWS resolved-cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-finops-aws-resolved-cost-${{ github.run_id }}
          path: reports/cost/aws-resolved-cost.json
          if-no-files-found: warn
          retention-days: 30


  azure-resolved-cost:
    name: Azure Resolved Cost
    runs-on: ubuntu-latest

    env:
      INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
      AZURE_COST_THRESHOLD_USD: "100"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false

      - name: Install Infracost
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh \
            | sh

          INFRACOST_VERSION="$(infracost --version)"

          echo "Installed Infracost: $INFRACOST_VERSION"

          if ! printf '%s\n' "$INFRACOST_VERSION" \
            | grep -qF 'infracost version 2.16.2'
          then
            echo "ERROR - unexpected Infracost version"
            exit 1
          fi

          infracost scan --help >/dev/null
          infracost inspect --help >/dev/null

          echo "PASS - Infracost resolved-cost runtime available"

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        shell: bash
        run: |
          set -euo pipefail

          SUBSCRIPTION_ID="$(
            az account show \
              --query id \
              -o tsv
          )"

          TENANT_ID="$(
            az account show \
              --query tenantId \
              -o tsv
          )"

          echo "Azure subscription: $SUBSCRIPTION_ID"
          echo "Azure tenant:       $TENANT_ID"

          if [ "$SUBSCRIPTION_ID" != "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "ERROR - unexpected Azure subscription"
            exit 1
          fi

          if [ "$TENANT_ID" != "${{ vars.AZURE_TENANT_ID }}" ]; then
            echo "ERROR - unexpected Azure tenant"
            exit 1
          fi

          echo "PASS - expected Azure OIDC identity active"

      - name: Verify FinOps policy engine
        shell: bash
        run: |
          set -euo pipefail

          bash -n scripts/cost/check-cost-policy.sh
          test -x scripts/cost/check-cost-policy.sh

          echo "PASS - FinOps policy engine valid"

      - name: Initialize Azure Terraform backend
        shell: bash
        run: |
          set -euo pipefail

          terraform \
            -chdir=terraform/azure/environments/dev \
            init \
            -input=false

          echo "PASS - Azure Terraform backend initialized"

      - name: Load managed Azure SSH public key from Terraform state
        shell: bash
        run: |
          set -euo pipefail

          STATE_JSON="$RUNNER_TEMP/mc-finops-azure-state.json"

          terraform \
            -chdir=terraform/azure/environments/dev \
            show \
            -json \
            >"$STATE_JSON"

          jq empty "$STATE_JSON"

          CURRENT_KEY="$(
            jq -r '
              [
                .values.root_module.resources[]?,
                .values.root_module.child_modules[]?.resources[]?
              ]
              | map(
                  select(
                    .type == "azurerm_linux_virtual_machine"
                  )
                )
              | .[0].values.admin_ssh_key[0].public_key // empty
            ' "$STATE_JSON"
          )"

          if [ -z "$CURRENT_KEY" ]; then
            echo "ERROR - current Azure VM SSH public key could not be read from Terraform state"
            exit 1
          fi

          {
            echo 'TF_VAR_azure_ssh_public_key<<MC_FINOPS_SSH_KEY'
            printf '%s\n' "$CURRENT_KEY"
            echo 'MC_FINOPS_SSH_KEY'
          } >>"$GITHUB_ENV"

          echo "Managed Azure SSH key fingerprint:"
          printf '%s\n' "$CURRENT_KEY" \
            | ssh-keygen -lf /dev/stdin

          rm -f "$STATE_JSON"

          echo "PASS - state-consistent Azure planning input loaded"

      - name: Evaluate Azure resolved cost
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports/cost

          export MC_FINOPS_EVIDENCE_FILE="reports/cost/azure-resolved-cost.json"

          scripts/cost/check-cost-policy.sh \
            terraform/azure/environments/dev

          echo "PASS - Azure resolved cost satisfies governed threshold"

      - name: Validate Azure governance evidence
        shell: bash
        run: |
          set -euo pipefail

          EVIDENCE="reports/cost/azure-resolved-cost.json"

          test -s "$EVIDENCE"
          jq empty "$EVIDENCE"

          jq -e '
            .schema_version == "1.0"
            and .control.control_id == "FINOPS-COST-001"
            and .control.cloud == "Azure"
            and .control.evaluation_mode == "plan-json"
            and .cost.currency == "USD"
            and .cost.threshold_monthly_cost == 100
            and .policy.policy_result == "ALLOW"
            and .policy.policy_exit_code == 0
            and .execution.terraform_plan_used == true
            and .execution.terraform_apply_used == false
            and .execution.oidc_used == true
            and .execution.authentication_type == "github-oidc"
            and .decision.governance_result == "ALLOW"
          ' "$EVIDENCE" >/dev/null

          echo "PASS - Azure governance evidence validated"

      - name: Upload Azure resolved-cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-finops-azure-resolved-cost-${{ github.run_id }}
          path: reports/cost/azure-resolved-cost.json
          if-no-files-found: warn
          retention-days: 30


  resolved-cost-result:
    name: Resolved Cost Gate
    runs-on: ubuntu-latest

    needs:
      - aws-resolved-cost
      - azure-resolved-cost

    if: always()

    steps:
      - name: Download resolved-cost evidence
        uses: actions/download-artifact@v4
        with:
          pattern: mc-finops-*-resolved-cost-${{ github.run_id }}
          path: reports/cost
          merge-multiple: true

      - name: Validate downloaded evidence
        shell: bash
        run: |
          set -euo pipefail

          test -s reports/cost/aws-resolved-cost.json
          test -s reports/cost/azure-resolved-cost.json

          jq empty reports/cost/aws-resolved-cost.json
          jq empty reports/cost/azure-resolved-cost.json

          echo "PASS - per-cloud evidence downloaded"

      - name: Build aggregate governance evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports/compliance

          AWS_EVIDENCE="reports/cost/aws-resolved-cost.json"
          AZURE_EVIDENCE="reports/cost/azure-resolved-cost.json"
          SUMMARY="reports/compliance/resolved-cost-summary.json"

          jq -n \
            --arg schema_version "1.0" \
            --arg repository "${{ github.repository }}" \
            --arg commit_sha "${{ github.sha }}" \
            --arg workflow "${{ github.workflow }}" \
            --arg workflow_run_id "${{ github.run_id }}" \
            --arg event "${{ github.event_name }}" \
            --arg aws_result "${{ needs.aws-resolved-cost.result }}" \
            --arg azure_result "${{ needs.azure-resolved-cost.result }}" \
            --slurpfile aws "$AWS_EVIDENCE" \
            --slurpfile azure "$AZURE_EVIDENCE" '
              {
                schema_version: $schema_version,

                metadata: {
                  repository: $repository,
                  commit_sha: $commit_sha,
                  workflow: $workflow,
                  workflow_run_id: $workflow_run_id,
                  event: $event,
                  environment: "dev"
                },

                controls: {
                  aws: $aws[0],
                  azure: $azure[0]
                },

                jobs: {
                  aws_resolved_cost: $aws_result,
                  azure_resolved_cost: $azure_result
                },

                decision: {
                  governance_result:
                    (
                      if
                        ($aws_result == "success")
                        and ($azure_result == "success")
                        and ($aws[0].decision.governance_result == "ALLOW")
                        and ($azure[0].decision.governance_result == "ALLOW")
                      then
                        "ALLOW"
                      else
                        "DENY"
                      end
                    )
                }
              }
            ' >"$SUMMARY"

          jq empty "$SUMMARY"

          echo "PASS - aggregate resolved-cost evidence created"

      - name: Write GitHub governance summary
        shell: bash
        run: |
          set -euo pipefail

          AWS="reports/cost/aws-resolved-cost.json"
          AZURE="reports/cost/azure-resolved-cost.json"
          SUMMARY="reports/compliance/resolved-cost-summary.json"

          AWS_COST="$(jq -r '.cost.estimated_monthly_cost' "$AWS")"
          AWS_THRESHOLD="$(jq -r '.cost.threshold_monthly_cost' "$AWS")"
          AWS_RESULT="$(jq -r '.decision.governance_result' "$AWS")"

          AZURE_COST="$(jq -r '.cost.estimated_monthly_cost' "$AZURE")"
          AZURE_THRESHOLD="$(jq -r '.cost.threshold_monthly_cost' "$AZURE")"
          AZURE_RESULT="$(jq -r '.decision.governance_result' "$AZURE")"

          OVERALL="$(jq -r '.decision.governance_result' "$SUMMARY")"

          {
            echo "# Multi-Cloud FinOps Governance"
            echo
            echo "| Cloud | Estimated Monthly Cost | Threshold | Result |"
            echo "| --- | ---: | ---: | --- |"
            printf '| AWS | USD %.2f | USD %.2f | %s |\n' \
              "$AWS_COST" "$AWS_THRESHOLD" "$AWS_RESULT"
            printf '| Azure | USD %.2f | USD %.2f | %s |\n' \
              "$AZURE_COST" "$AZURE_THRESHOLD" "$AZURE_RESULT"
            echo
            echo "## Execution Controls"
            echo
            echo "- GitHub OIDC used for AWS planning"
            echo "- GitHub OIDC used for Azure planning"
            echo "- Terraform plan used for both clouds"
            echo "- Terraform apply prohibited"
            echo "- Terraform destroy prohibited"
            echo "- Automatic remediation not executed"
            echo
            echo "## Governance Result"
            echo
            echo "**$OVERALL**"
          } >>"$GITHUB_STEP_SUMMARY"

          echo "PASS - GitHub Step Summary generated"

      - name: Upload combined governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-finops-governance-evidence-${{ github.run_id }}
          path: |
            reports/cost/aws-resolved-cost.json
            reports/cost/azure-resolved-cost.json
            reports/compliance/resolved-cost-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Evaluate resolved-cost governance
        shell: bash
        run: |
          set -euo pipefail

          AWS_RESULT="${{ needs.aws-resolved-cost.result }}"
          AZURE_RESULT="${{ needs.azure-resolved-cost.result }}"

          echo "AWS resolved cost:   $AWS_RESULT"
          echo "Azure resolved cost: $AZURE_RESULT"

          if \
            [ "$AWS_RESULT" = "success" ] \
            && [ "$AZURE_RESULT" = "success" ]
          then
            echo
            echo "RESOLVED COST RESULT: ALLOW"
            echo "Both cloud environments satisfy modeled-cost thresholds."
            exit 0
          fi

          echo
          echo "RESOLVED COST RESULT: DENY"
          echo "One or more resolved-cost controls failed."
          exit 1
