name: Azure OIDC Validation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-azure-oidc:
    name: Validate GitHub OIDC to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure account
        run: |
          az account show \
            --query '{
              Name:name,
              SubscriptionId:id,
              TenantId:tenantId,
              User:user.name,
              UserType:user.type
            }' \
            -o table

      - name: Verify expected subscription
        run: |
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

          if [ "$SUBSCRIPTION_ID" != "${{ vars.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "ERROR - unexpected Azure subscription: $SUBSCRIPTION_ID"
            exit 1
          fi

          echo "PASS - authenticated to expected Azure subscription"
